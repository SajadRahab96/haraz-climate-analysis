name: Download CMIP6 Data

on:
  workflow_dispatch:  # Allows manual trigger from GitHub UI
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at 00:00 UTC
  push:
    branches: [ main ]
    paths:
      - 'data_processing/07_download_cmip6_gcs.py'
      - 'requirements.txt'

jobs:
  download-cmip6:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Download may take 30-40 minutes

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run CMIP6 download (GCS route)
      run: |
        echo "Starting CMIP6 download via Google Cloud Pangeo Zarr..."
        python data_processing/07_download_cmip6_gcs.py --output data/cmip6_gcs/
      continue-on-error: false

    - name: List downloaded files
      run: |
        echo "Downloaded files structure:"
        find data/cmip6_gcs/ -name "*.csv" -type f | head -20
        echo "Total CSV files:"
        find data/cmip6_gcs/ -name "*.csv" -type f | wc -l

    - name: Upload data as artifact
      uses: actions/upload-artifact@v4
      with:
        name: cmip6-data
        path: data/cmip6_gcs/
        retention-days: 7

    - name: Create summary report
      run: |
        echo "# CMIP6 Download Summary" > download_summary.md
        echo "Date: $(date)" >> download_summary.md
        echo "" >> download_summary.md
        echo "## Files downloaded:" >> download_summary.md
        find data/cmip6_gcs/ -name "*.csv" -type f | sort >> download_summary.md
        echo "" >> download_summary.md
        echo "## Directory structure:" >> download_summary.md
        tree data/cmip6_gcs/ --noreport 2>/dev/null || find data/cmip6_gcs/ -type f | head -30 >> download_summary.md

    - name: Upload summary report
      uses: actions/upload-artifact@v4
      with:
        name: download-summary
        path: download_summary.md

    - name: Notify completion
      if: success()
      run: |
        echo "✅ CMIP6 download completed successfully!"
        echo "Artifacts available in GitHub Actions UI."